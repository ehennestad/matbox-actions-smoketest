name: Prepare toolbox release

# Smoke test: exercise the full matbox-actions release pipeline against @main
# (validate version, build matrix, test, package, draft release, verify install).
# Trigger manually with a version, or by pushing a vX.Y.Z tag.
#
# Requires a DEPLOY_KEY secret (SSH private key whose public key is added as a
# deploy key with write access). matlab_versions spans this toolbox's minimum
# supported release through a recent one, deliberately spread rather than a
# single version, so the test matrix's multi-job fan-out (parallel jobs,
# per-version report artifacts, badge aggregation across them) is actually
# exercised, and so install-matbox is exercised on more than one MATLAB
# release: it caught a real regression (release-mode install failing on
# R2024b) that a single, always-"latest" version would have missed.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format'
        required: true
        type: string

permissions:
  contents: write

# Serialize releases rather than cancelling one: the pipeline pushes to shared
# refs (main, gh-badges), and killing a run mid-push would leave those refs
# in a half-updated state. Concurrent runs race on those pushes without this.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare toolbox release
    uses: ehennestad/matbox-actions/.github/workflows/prepare-release-workflow.yml@main
    with:
      version: ${{ inputs.version }}
      ref_name: ${{ github.ref_name }}
      source_directory: src
      tests_directory: tests
      tools_directory: tools
      matlab_versions: '["R2021a", "R2024b", "R2026a"]'
      needs_python: false
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
